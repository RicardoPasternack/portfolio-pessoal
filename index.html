<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu portfólio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <span class="logo">Ricardo</span>

        <nav>

    </header>
    <main id="inicio">

        <img

        src="imagens/logo.png"
        alt="Avatar ilustrado"

        <div class="apresentacao">
            <h1>Olá eu sou o <span>Ricardo Pasternack</span></h1>

        Tecnologia e organização para simplificar o dia a dia.
            </p>
            <a class="botao" href="#projetos">Ver projetos</a>
        </div>

        <section id="projetos" class="projetos">
            <h2>Projetos</h2>
            <article class="projeto">
                <h3>Portfólio pessoal</h3>

                <p>
                    Site de apresentação profissional com layout adaptável
                    para diferentes tamanhos de tela.
                </p>

                <p>HTML e CSS</p>
            </article>
        </section>

    </main>

</html>
